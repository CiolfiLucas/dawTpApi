<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty API</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <h1>Rick and Morty API</h1>

    <div class="botones">

        <button id="btnTodos">Ver todos los personajes</button>

    </div>

    <div class="filtros">

        <input type="text"
        id="nombre"
        placeholder="Nombre">

        <input type="text"
        id="estado"
        placeholder="Estado (alive, dead, unknown)">

        <input
        type="text"
        id="especies"
        placeholder="Especie">

        <input type="text" id="tipo"
        placeholder="Tipo">

        <input
        type="text"
        id="genero"
        placeholder="Género (male, female, genderless, unknown)">

        <button id="btnBuscar">Buscar</button>

    </div>

    <p id="mensaje"></p>

    <div id="resultado"></div>

</div>

<script src="scripts.js"></script>

</body>

</html>
